---
# CI: lint + functional tests on every push/PR, and publish to Ansible Galaxy
# on version tag pushes using the GALAXY_API_KEY secret.

name: CI

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (yamllint + ansible-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          pip install --upgrade pip
          pip install "ansible-core>=2.16" ansible-lint yamllint

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

  molecule:
    name: Molecule (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        scenario: [default, email]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          pip install --upgrade pip
          pip install "ansible-core>=2.16" molecule molecule-plugins[docker] aiosmtpd

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Molecule test
        run: molecule test -s ${{ matrix.scenario }}

  publish:
    name: Publish to Ansible Galaxy
    runs-on: ubuntu-latest
    needs: [lint, molecule]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ansible-core
        run: pip install "ansible-core>=2.16"

      - name: Import role into Ansible Galaxy
        run: >-
          ansible-galaxy role import
          --token "${{ secrets.GALAXY_API_KEY }}"
          "${{ github.event.repository.owner.login }}"
          "${{ github.event.repository.name }}"
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
